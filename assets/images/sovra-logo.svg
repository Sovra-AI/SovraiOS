<!--
  Sovra mark · lit-mark · dark theme.

  Same silhouette gradient as neon-lit-glow-dark (purple-500 → purple-600 →
  purple-700 radial, centre offset upper-left to track the 135deg axis used by
  the gradient-purple token) but with the three halo layers stripped. Solid
  shape, no glow, designed for sovra-bg (#0a0514).

  Use when you want the brand-purple lit silhouette without the surrounding
  neon halo — denser UI contexts, navbar marks, smaller sizes where a halo
  would muddy the read.
-->
