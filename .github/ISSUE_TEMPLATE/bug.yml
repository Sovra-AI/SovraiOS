name: Bug
description: Something is broken or unexpected
title: "🐛 "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/Sovra-AI/SovraiOS/blob/main/SECURITY.md). Do not post security details here.
        Remove pairing links, keys, tokens, and personal data from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Numbered steps from opening the app.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      description: For example, the phone model or emulator and its OS version.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App commit and desktop version
      description: App `git rev-parse --short HEAD`, and the SovraHarness version on your computer.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant lines from the Metro or Xcode console. Strip pairing links, keys, and tokens.
      render: text
